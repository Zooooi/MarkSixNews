<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>About - Mark Six Stats</title>
  <link rel="stylesheet" href="./assets/style.css">
</head>
<body>

  <div class="container">
    
    <!-- Header -->
    <div class="header">
      <div class="brand-title">
        <img src="../images/site_logo.webp" alt="Mark Six Stats Logo">
        Mark Six Stats
      </div>
      <div class="tagline"></div>
    </div>

    <!-- Official Channels -->
    <div class="card">
      <div class="card-title">Official Channels</div>
      <div class="links-grid">
        <div class="link-btn">
          <div class="link-left">
            <span class="link-icon">🌐</span>
            <span>Official Web</span>
          </div>
          <span style="color: var(--accent-blue)">app.mark6stats.com</span>
        </div>

        <div class="link-btn">
          <div class="link-left">
            <span class="link-icon">📢</span>
            <span>News Handle</span>
          </div>
          <span style="color: var(--accent-blue)">@mark6stats</span>
        </div>
      </div>
    </div>

    <!-- 聯絡方式區塊 -->
    <div class="card contact-box" style="text-align: center;">
      <img class="developer" src="../images/developer.webp" alt="Tou Suk" style="width: 100px; display: block; margin: 0 auto 12px auto;">
      
      <div>
        若有任何疑問，請聯絡 <b>兔叔</b>：
        <div class="lang-en" style="color: #aaa; font-size: 13px; margin-top: 4px;">
          For any inquiries, please contact <b>Tou Suk</b> at:
        </div>
      </div>

      <div style="margin-top: 12px; font-weight: bold; color: var(--accent-blue);">
        Email: hi@mark6stats.com
      </div>
    </div>

    <!-- Footer -->
    <div class="footer">
      <div class="copyright">
        © 2022-<span id="current-year"></span> Mark 6 Stats. All rights reserved.
      </div>
      <script>
        document.getElementById("current-year").textContent = new Date().getFullYear();
      </script>
    </div>

  </div>

</body>
</html>
